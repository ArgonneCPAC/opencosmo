name: docker image
on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated list of fully-qualified image tags to build.
        required: true
        type: string
      push:
        description: Push the image to Docker Hub.
        default: false
        required: false
        type: boolean
      ref:
        description: Git ref to build from (defaults to the triggering ref).
        default: ''
        required: false
        type: string
      platforms:
        description: Comma-separated build platforms.
        default: linux/amd64,linux/arm64
        required: false
        type: string
    secrets:
      docker-username:
        required: false
      docker-access-key:
        required: false

env:
  IMAGE: docker.io/astropatty/opencosmo

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - name: Build matrix from requested platforms
        id: mk
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          platforms=",${PLATFORMS// /},"
          entries=()
          case "$platforms" in
            *,linux/amd64,*) entries+=('{"platform":"linux/amd64","runner":"ubuntu-latest"}') ;;
          esac
          case "$platforms" in
            *,linux/arm64,*) entries+=('{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}') ;;
          esac
          if [ ${#entries[@]} -eq 0 ]; then
            echo "No supported platforms in '$PLATFORMS'" >&2
            exit 1
          fi
          IFS=,
          echo "matrix={\"include\":[${entries[*]}]}" >> "$GITHUB_OUTPUT"

  # One native runner per architecture - no QEMU emulation. When pushing, each
  # leg pushes a per-arch image by digest and the merge job assembles the
  # multi-arch manifest. When not pushing (PR checks) each leg just builds.
  build:
    name: Build ${{ matrix.platform }}
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-access-key }}
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/ArgonneCPAC/OpenCosmo
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          provenance: false
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
      - name: Export digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    if: ${{ inputs.push }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-access-key }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          mapfile -t tags < <(printf '%s\n' "$TAGS" | grep -v '^[[:space:]]*$')
          docker buildx imagetools create \
            "${tags[@]/#/--tag=}" \
            $(printf "${IMAGE}@sha256:%s " *)
          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect "$tag"
          done
