name: docker image
on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated list of fully-qualified image tags to build.
        required: true
        type: string
      push:
        description: Push the image to Docker Hub.
        default: false
        required: false
        type: boolean
      ref:
        description: Git ref to build from (defaults to the triggering ref).
        default: ''
        required: false
        type: string
      platforms:
        description: Comma-separated build platforms.
        default: linux/amd64,linux/arm64
        required: false
        type: string
    secrets:
      docker-username:
        required: false
      docker-access-key:
        required: false

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker-username }}
          password: ${{ secrets.docker-access-key }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/ArgonneCPAC/OpenCosmo
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
