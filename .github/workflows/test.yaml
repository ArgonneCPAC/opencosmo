name: test opencosmo
on: workflow_call

# Azure-hosted runners sporadically expose the MANA NIC as an RDMA verbs
# device (mana_0). UCX (used by the MPICH that setup-mpi installs) then tries
# to open a UD verbs transport on it and aborts MPI_Init with an I/O error.
# Restricting UCX to shared-mem/self/TCP avoids the verbs path entirely.
env:
  UCX_TLS: sm,self,tcp
  UCX_NET_DEVICES: lo

jobs:
  get-test-data:
    runs-on: ubuntu-latest
    steps:
      - name: check if cache exists
        id: check-cache
        uses: actions/cache@v5
        with:
          path: test_data.tar.gz
          key: test-data
          lookup-only: true
          restore-keys: |
            test-data
      - name: Setup AWS CLI
        if: steps.check-cache.outputs.cache-hit != 'true'
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.TEST_DATA_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TEST_DATA_SECRET_KEY }}
          aws-region: us-west-2
      - name: Download test data 
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: aws s3 cp s3://${{ secrets.TEST_DATA_BUCKET }}/test_data.tar.gz test_data.tar.gz
      - name: Cache test data
        if: steps.check-cache.outputs.cache-hit != 'true'
        id: cache-test-data
        uses: actions/cache@v5
        with:
          path: test_data.tar.gz
          key: test-data
          enableCrossOsArchive: true
          
  run-tests:
    name: Run tests
    runs-on: ${{ matrix.os }}
    needs: [get-test-data]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: get test data
        uses: actions/cache@v5
        with:
          path: test_data.tar.gz
          key: test-data
          enableCrossOsArchive: true
      - name: Unpack test data
        run: |
          mkdir -p test_data
          tar -xzf test_data.tar.gz -C test_data
      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.8.2"
      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --group test

      - name: install analysis dependencies
        run: uv run opencosmo install haloviz --dev
      - name: Run tests with pytest
        run: |
          uv run pytest --ignore=test/parallel

  run-mpi-tests:
    name: Run mpi tests
    runs-on: ${{ matrix.os }}
    needs: [get-test-data]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup mpi
        uses: mpi4py/setup-mpi@v1
      - name: get test data
        uses: actions/cache@v4
        with:
          path: test_data.tar.gz
          key: test-data
          enableCrossOsArchive: true
      - name: Unpack test data
        run: |
          mkdir -p test_data
          tar -xzf test_data.tar.gz -C test_data
      - name: install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.8.2"
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --group test --group mpi --group test-mpi

      - name: Run tests with pytest
        run: |
          mpiexec -n 4 uv run pytest test/parallel
